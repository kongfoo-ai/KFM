services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:8000"
    environment:
      WEB_DATA_DIR: /data
      DEPLOY_TYPE: ${DEPLOY_TYPE:-DEV}
      OPM_MODEL: ${OPM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPM_OPENAI_EXTRA_HEADERS: ${OPM_OPENAI_EXTRA_HEADERS:-}
      OPM_TOP_P: ${OPM_TOP_P:-}
    volumes:
      - web_data:/data

volumes:
  web_data:
